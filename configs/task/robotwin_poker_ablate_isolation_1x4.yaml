# @package _global_
#
# C2 ablation — attention ISOLATION off (clean single-variable).
#
# Identical to the treatment arm `robotwin_poker_action_image_1x4.yaml` in EVERY
# respect except the pinned clean conditioning frame is NO LONGER causally
# isolated: `video_attention_mask_mode` goes from `segment_first_frame_causal` to
# `segment_first_frame_bidirectional`. Both modes pin the action image at latent
# index T//2, stamp it t=0, and consume the action image identically at train and
# eval; the ONLY difference is that the bidirectional variant lets the pinned
# frame's hidden state be polluted by the noisy future frames. This is the "off"
# row for C2 condition (c).
defaults:
  - override /data: robotwin_action_image
  - override /model: fastwam_action_image
  - _self_

batch_size: 8
num_workers: 8

data:
  train:
    tasks: [move_playingcard_away]
  val:
    tasks: [move_playingcard_away]

model:
  mot_checkpoint_mixed_attn: false
  video_dit_config:
    # Ablation: keep the dual-segment pin + t=0 stamp, drop only the causal isolation.
    video_attention_mask_mode: segment_first_frame_bidirectional

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2500
eval_every: 2500

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
