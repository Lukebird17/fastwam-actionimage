# @package _global_
#
# C2 ablation — clean-frame t=0 TIMESTAMP off.
#
# Identical to the treatment arm `robotwin_poker_action_image_1x4.yaml` in EVERY
# respect except the injected clean conditioning frame is NOT stamped with
# per-token timestep t=0: `mark_clean_conditioning_frame: false` leaves the clean
# frame at the shared (noisy) timestep, so as sigma -> 1 the modulation signal is
# self-contradictory (a clean value wearing a noisy-time embedding). This is the
# "off" row for C2 condition (b).
defaults:
  - override /data: robotwin_action_image
  - override /model: fastwam_action_image
  - _self_

batch_size: 8
num_workers: 8

data:
  train:
    tasks: [move_playingcard_away]
  val:
    tasks: [move_playingcard_away]

model:
  mot_checkpoint_mixed_attn: false
  video_dit_config:
    # Ablation: do NOT stamp the clean conditioning frame with t=0.
    mark_clean_conditioning_frame: false

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2500
eval_every: 2500

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
